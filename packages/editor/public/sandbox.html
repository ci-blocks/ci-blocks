<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CIB Sandbox</title>
</head>
<body>
<script>
    // 沙箱内部：接收主页面指令，执行积木代码
    // 所有消息通过 postMessage 收发，结构 { id, type, payload }

    const 模块注册表 = new Map(); // 积木id → { 定义, 生成IR }

    self.addEventListener('message', async (e) => {
        const 数据 = e.data;
        if (!数据 || typeof 数据 !== 'object') return;

        const { id, type, payload } = 数据;

        try {
            if (type === 'ping') {
                回(id, { ok: true, pong: true });
                return;
            }

            if (type === '加载积木') {
                // payload: { url, 源码 }  或  { 源码, 名称 }
                const 结果 = await 加载积木(payload);
                回(id, { ok: true, 积木列表: 结果 });
                return;
            }

            if (type === '调用生成IR') {
                // payload: { 积木id, 输入 }
                const 结果 = 调用生成IR(payload.积木id, payload.输入);
                回(id, { ok: true, ir: 结果 });
                return;
            }

            if (type === '卸载积木') {
                模块注册表.delete(payload.积木id);
                回(id, { ok: true });
                return;
            }

            回(id, { ok: false, 错误: '未知指令：' + type });
        } catch (err) {
            回(id, { ok: false, 错误: String(err && err.message || err) });
        }
    });

    function 回(id, 数据) {
        self.parent.postMessage({ id, ...数据 }, '*');
    }

    async function 加载积木({ url, 源码 }) {
        let 代码 = 源码;

        if (!代码 && url) {
            const r = await fetch(url, { credentials: 'omit' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            代码 = await r.text();
        }

        if (!代码) throw new Error('无源码可加载');

        // 在沙箱里 eval。这里可以换成更严格的方案（如 SES / Realms），
        // 但 iframe 已是隔离边界，普通 eval 足以满足「不接触主页面」。
        const 模块URL = URL.createObjectURL(new Blob([代码], { type: 'application/javascript' }));
        const mod = await import(/* @vite-ignore */ 模块URL);
        URL.revokeObjectURL(模块URL);

        const 导出 = mod.default ?? mod;
        const 候选 = Array.isArray(导出) ? 导出 : [导出];
        const 合法 = 候选.filter((b) => b && typeof b === 'object' && typeof b.id === 'string');

        const 描述列表 = [];
        for (const b of 合法) {
            // 只回传可结构化克隆的字段，函数剥离
            模块注册表.set(b.id, b);
            描述列表.push({
                id: b.id,
                keyword: b.keyword,
                version: b.version,
                category: b.category,
                meta: 剥函数(b.meta),
                schema: 剥函数(b.schema),
            });
        }
        return 描述列表;
    }

    function 调用生成IR(积木id, 输入) {
        const b = 模块注册表.get(积木id);
        if (!b) throw new Error('积木未注册：' + 积木id);
        if (typeof b.生成IR !== 'function') throw new Error('积木没有 生成IR');
        const 结果 = b.生成IR(输入);
        if (!Array.isArray(结果)) throw new Error('生成IR 必须返回数组');
        return 结果;
    }

    /** 深拷贝时剥掉函数，防止结构化克隆失败 */
    function 剥函数(v) {
        if (v === null || typeof v !== 'object') return v;
        if (Array.isArray(v)) return v.map(剥函数);
        const o = {};
        for (const [k, val] of Object.entries(v)) {
            if (typeof val === 'function') continue;
            o[k] = 剥函数(val);
        }
        return o;
    }
</script>
</body>
</html>
